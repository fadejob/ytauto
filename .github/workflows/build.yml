# Har main'ga push (app/ o'zgarganda): testlar -> BITTA YtAuto.exe (self-contained single-file, win-x64; oyna va worker ichida) -> GitHub Release.
# Pull request'larda faqat build va testlar.
name: Build

on:
  push:
    branches: [main]
    paths: ['app/**', 'bot/db/schema.sql', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
    paths: ['app/**', 'bot/db/schema.sql', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testlar
        run: dotnet test tests/YtAuto.Tests -c Release --logger "console;verbosity=normal"

      - name: Bitta exe yig'ish (self-contained single-file win-x64)
        shell: pwsh
        # Bot manzili exe'ga yoziladi: standart https://ytauto-kappa.vercel.app (Directory.Build.props). Boshqa bot uchun repo Variables → YTAUTO_BOT_URL.
        env:
          YTAUTO_BOT_URL: ${{ vars.YTAUTO_BOT_URL }}
        run: ./publish.ps1 -Dotnet dotnet -Version $env:VERSION -BotUrl "$env:YTAUTO_BOT_URL"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YtAuto-${{ env.VERSION }}
          path: app/dist/YtAuto.exe
          retention-days: 30

      - name: GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = "Avtomatik build: ``$env:GITHUB_SHA``.`n`nO'rnatish: ``YtAuto.exe`` ni yuklab ishga tushiring - birinchi ochilishda doimiy papkani so'raydi (standart: %LOCALAPPDATA%\Programs\YtAuto), o'zini o'sha yerga ko'chirib, yorliq yaratadi. Yangi versiyani ham shunday ochsangiz, o'rnatilganini yangilaydi. .NET o'rnatish shart emas."
          gh release create $tag dist/YtAuto.exe --title "YtAuto $env:VERSION" --notes $notes --target $env:GITHUB_SHA
