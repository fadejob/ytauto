# Har main'ga push: testlar -> self-contained win-x64 build (YtAuto.exe + YtAuto.Worker.exe) -> GitHub Release (zip).
# Pull request'larda faqat build va testlar.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testlar
        run: dotnet test tests/YtAuto.Tests -c Release --logger "console;verbosity=normal"

      - name: Exe yig'ish (self-contained win-x64)
        shell: pwsh
        run: ./publish.ps1 -Dotnet dotnet -Version $env:VERSION

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YtAuto-win-x64-${{ env.VERSION }}
          path: dist/YtAuto-win-x64.zip
          retention-days: 30

      - name: GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = "Avtomatik build: ``$env:GITHUB_SHA``.`n`nO'rnatish: ``YtAuto-win-x64.zip`` ni oching va ``YtAuto.exe`` ni ishga tushiring (.NET o'rnatish shart emas)."
          gh release create $tag dist/YtAuto-win-x64.zip --title "YtAuto $env:VERSION" --notes $notes --target $env:GITHUB_SHA
